name: ci
on:
  push:
    branches:
      - master
      - main
  # Build (but do not deploy) on PRs, so docs breakage is caught before it
  # reaches the public site instead of on the way out to gh-pages.
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache MkDocs
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Install package with docs dependencies
        run: pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build

      # Push-only: gh-deploy needs contents:write, which a fork PR's token
      # does not have, and a PR must not publish to gh-pages regardless.
      - name: Deploy documentation
        if: github.event_name == 'push'
        run: mkdocs gh-deploy --force
