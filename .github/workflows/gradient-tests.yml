name: gradient-tests
# Gradient-correctness suite on deterministic CPU. Added 2026-08-14 after
# run_all.sh's missing pipefail let assertion failures masquerade as passes.
# NOTE: not yet verified on a hosted runner (heavy deps: warp, newton
# submodule, openmesh). If the install step fights the runner, fix or gate it
# rather than deleting the job — this suite is the guardrail for the adjoint.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gradient-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync environment
        run: uv sync --frozen

      - name: Run gradient test suite (CPU)
        env:
          WARP_DEVICE: cpu
        run: bash tests/differentiable_simulator/run_all.sh
